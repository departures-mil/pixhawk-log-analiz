name: build-and-release

# main'e her gönderimde Windows exe derlenir. app/version.py içindeki sürümün
# henüz Release'i yoksa vX.Y.Z otomatik yayınlanır; programın içindeki
# "Güncelle" düğmesi yeni sürümü buradan indirir.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content app/version.py -Raw), 'VERSION\s*=\s*"([^"]+)"')).Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $exists = $false
          gh release view "v$v" --repo "${{ github.repository }}" 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v exists=$exists"
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (synthetic scenarios)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools_ci/test_delta.py && python tools_ci/test_tuning.py && python tools_ci/selftest.py

      - name: Build exe (portable)
        run: pyinstaller --noconfirm --clean PixhawkLogAnaliz.spec

      - name: Build folder (for Setup)
        run: pyinstaller --noconfirm PixhawkLogAnaliz_dir.spec

      - name: Build Setup (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Smoke test (silent install + uninstall)
        shell: pwsh
        run: |
          $s = "dist\PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe"
          Start-Process $s -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $d = "$env:LOCALAPPDATA\Programs\Pixhawk Log Analiz"
          if (-not (Test-Path "$d\PixhawkLogAnaliz.exe")) { Write-Error 'install failed'; exit 1 }
          if (-not (Test-Path "$d\_internal\app\data\letterheads\mod_fixed_wing.jpg")) { Write-Error 'letterhead missing'; exit 1 }
          Start-Process $s -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          Start-Process "$d\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 3
          Write-Host "install/upgrade/uninstall OK"

      # "Yalnızca değişen kısımlar": son 5 sürümün her biri için yama üret, CI içinde eski dosyaya uygulayıp
      # yeni sürümle SHA-256 düzeyinde birebir aynı olduğunu doğrula; tam dosyanın %70'inden büyük yamayı atla.
      - name: Delta patches (last 5 releases, verified)
        if: steps.ver.outputs.exists != 'True'
        continue-on-error: true
        timeout-minutes: 60
        env:
          PYTHONIOENCODING: utf-8
          GH_TOKEN: ${{ github.token }}
        run: python tools_ci/make_patches.py --version ${{ steps.ver.outputs.version }} --new-dir dist/PixhawkLogAnaliz --new-portable dist/PixhawkLogAnaliz.exe --setup dist/PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe --out dist/patches

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.exists != 'True'
        with:
          name: patches-v${{ steps.ver.outputs.version }}
          path: dist/patches/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: PixhawkLogAnaliz-v${{ steps.ver.outputs.version }}
          path: |
            dist/PixhawkLogAnaliz.exe
            dist/PixhawkLogAnaliz_Setup_*.exe

      # GitHub varlıkları ada göre sıralar; v1.0.0'daki eski güncelleyici listedeki ilk .exe'yi alır.
      # "PixhawkLogAnaliz.exe" < "PixhawkLogAnaliz_Setup_…" olduğundan taşınabilir exe hep ilk sırada kalır.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists != 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Pixhawk Log Analiz v${{ steps.ver.outputs.version }}
          files: dist/PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
          make_latest: true

      - name: Attach portable exe (listed first)
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists != 'True'
        shell: pwsh
        run: |
          Start-Sleep 2
          gh release upload "v${{ steps.ver.outputs.version }}" "dist/PixhawkLogAnaliz.exe" --repo "${{ github.repository }}" --clobber
          # yamalar + dizin (adları .exe ile bitmez; eski güncelleyicilerin seçimini etkilemez)
          if (Test-Path dist/patches/delta-index.json) {
            $files = Get-ChildItem dist/patches/* | ForEach-Object { $_.FullName }
            gh release upload "v${{ steps.ver.outputs.version }}" @files --repo "${{ github.repository }}" --clobber
          }
        env:
          GH_TOKEN: ${{ github.token }}

      # Mevcut sürümde Setup ilk sıradaysa onu yeni adla yeniden yükleyip eskisini sil.
      - name: Fix asset order of existing release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'True'
        shell: pwsh
        run: |
          $first = gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.ver.outputs.version }}" --jq '[.assets[] | select(.name | endswith(".exe"))][0].name'
          Write-Host "first exe asset: $first"
          if ($first -like '*Setup*') {
            gh release upload "v${{ steps.ver.outputs.version }}" "dist/PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe" --repo "${{ github.repository }}" --clobber
            gh release delete-asset "v${{ steps.ver.outputs.version }}" "$first" --repo "${{ github.repository }}" --yes
            gh api "repos/${{ github.repository }}/releases/tags/v${{ steps.ver.outputs.version }}" --jq '.assets[].name'
          }
        env:
          GH_TOKEN: ${{ github.token }}
