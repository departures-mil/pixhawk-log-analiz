name: release

# Her gönderimde: test (öz-test + pytest/offscreen Qt) → build (Windows: PyInstaller tek exe + klasör, Inno Setup,
# sessiz kur/yükselt/kaldır duman testi, win-app zip'inin kurulu klasörden bayt bayt yeniden üretilebildiği denetimi).
# Yalnız main'de: ortak reusable-release (latest.json + son 5 sürümden FCD1 yamaları, SHA-256) ile v<sürüm> yayınlanır.
# Kurulu v1.0.x programları GitHub API releases/latest'teki "…Setup….exe"yi bulup sessiz kurar (köprü; bkz. tests/test_kopru.py).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Self-test (synthetic scenarios) + tuning
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python tools_ci/test_tuning.py && python tools_ci/selftest.py
      - name: pytest (offscreen Qt — pencere, üst çubuk, ayarlar, eşitleme kuralı, güncelleme, köprü)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content app/version.py -Raw), 'VERSION\s*=\s*"([^"]+)"')).Groups[1].Value
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "version X.Y.Z olmali: $v"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (portable, win-exe)
        run: pyinstaller --noconfirm --clean PixhawkLogAnaliz.spec

      - name: Build folder (win-app + Setup)
        run: pyinstaller --noconfirm PixhawkLogAnaliz_dir.spec

      - name: Build Setup (Inno Setup, per-user)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: win-app package (fcpack, deterministic)
        run: python -m fccore.fcpack dist/PixhawkLogAnaliz dist/PixhawkLogAnaliz-win-app.zip

      - name: Smoke test (silent install + upgrade + win-app base + uninstall)
        shell: pwsh
        run: |
          $s = "dist\PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe"
          Start-Process $s -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $d = "$env:LOCALAPPDATA\Programs\Pixhawk Log Analiz"
          if (-not (Test-Path "$d\PixhawkLogAnaliz.exe")) { Write-Error 'install failed'; exit 1 }
          if (-not (Test-Path "$d\_internal\app\data\letterheads\mod_fixed_wing.jpg")) { Write-Error 'letterhead missing'; exit 1 }
          if (-not (Test-Path "$d\_internal\fccore\fonts\Inter-400.ttf")) { Write-Error 'fccore fonts missing'; exit 1 }
          if (Test-Path "$d\unins000.exe") { Write-Error 'uninstaller must live outside the app folder'; exit 1 }
          if (-not (Test-Path "$d-uninstall\unins000.exe")) { Write-Error 'uninstaller missing'; exit 1 }
          # istemci yama tabanını kurulu klasörden yeniden üretir: CI zip'iyle bayt bayt aynı olmalı
          python -m fccore.fcpack "$d" installed.zip
          $a = (Get-FileHash dist\PixhawkLogAnaliz-win-app.zip -Algorithm SHA256).Hash
          $b = (Get-FileHash installed.zip -Algorithm SHA256).Hash
          if ($a -ne $b) { Write-Error "win-app zip not reproducible from install dir ($a vs $b)"; exit 1 }
          # program yazılabilir mi (win-app takası için)
          New-Item -ItemType File "$d\.fc-w-test" | Out-Null; Remove-Item "$d\.fc-w-test"
          Start-Process $s -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          Start-Process "$d-uninstall\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep 3
          if (Test-Path "$d\PixhawkLogAnaliz.exe") { Write-Error 'uninstall left files'; exit 1 }
          Write-Host "install/upgrade/win-app base/uninstall OK"

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist\PixhawkLogAnaliz-win-app.zip, dist\PixhawkLogAnaliz.exe, "dist\PixhawkLogAnaliz_Setup_${{ steps.ver.outputs.version }}.exe" release\
          python tools_ci/release_notes.py release/release-notes.json
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: release/
          retention-days: 3

  release:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: departures-mil/ortak-cekirdek/.github/workflows/reusable-release.yml@main
    with:
      app_id: pixhawk-log-analiz
      version: ${{ needs.build.outputs.version }}
      file_prefix: PixhawkLogAnaliz
      # Asset adları sabit: eski (v1.0.x) güncelleyiciler 'setup' içeren .exe'yi, v1.0.0 ilk .exe'yi (taşınabilir) alır.
      files: |
        win-app=PixhawkLogAnaliz-win-app.zip=PixhawkLogAnaliz-{version}-win-app.zip
        win-setup=PixhawkLogAnaliz_Setup_*.exe=PixhawkLogAnaliz_Setup_{version}.exe
        win-exe=PixhawkLogAnaliz.exe=PixhawkLogAnaliz.exe
      notes_json: release-notes.json
      release_title: Pixhawk Log Analiz v${{ needs.build.outputs.version }}
      core_ref: main
