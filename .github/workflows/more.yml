name: crashbench-more

# Ek tarama: geliştirme ve ayrı test setlerinde OLMAYAN yeni forum logları + uzman yanıtları. Tetik: tools_data/request_more.txt
on:
  push:
    paths: ['tools_data/request_more.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest new logs (not in dev set)
        env:
          BENCH_DIR: /tmp/more
          BENCH_SKIP_KNOWN: '1'
          BENCH_N_CRASH: '160'
          BENCH_N_NORMAL: '90'
          BENCH_TOTAL_MB: '9000'
          BENCH_MAX_MB: '100'
          BENCH_PAGES: '30'
        run: python tools_data/crashbench.py harvest
      - name: Expert replies
        env:
          BENCH_DIR: /tmp/more
          BENCH_THREADS_OUT: more_threads.json.gz
        run: python tools_data/crashbench.py threads
      - name: Upload logs to draft release bench-more
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/more && tar czf /tmp/more.tgz *.bin manifest.json && cd /tmp && split -b 1900m -d more.tgz more.tgz.part
          gh release view bench-more --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create bench-more --draft --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "bench-more (taslak, kullanıcıya görünmez)" --notes "ek tarama"
          gh release upload bench-more /tmp/more.tgz.part* --clobber --repo "${{ github.repository }}"
      - name: Commit threads
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp tools_data/crashbench/more_threads.json.gz /tmp/mt.json.gz
          for i in 1 2 3 4 5; do
            git fetch -q origin "${{ github.ref_name }}" && git reset -q --hard "origin/${{ github.ref_name }}"
            cp /tmp/mt.json.gz tools_data/crashbench/more_threads.json.gz
            git add tools_data/crashbench/more_threads.json.gz
            git commit -qm "crashbench: ek tarama uzman yanıtları (otomatik)" || exit 0
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i*10))
          done
          exit 1
